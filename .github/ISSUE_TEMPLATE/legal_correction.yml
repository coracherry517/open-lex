name: 📝 条文 / 译文勘误
description: 条文原文、生效日期、译文或案例关联有误
labels: ["data", "correction"]
body:
  - type: input
    id: uri
    attributes: { label: 条文链接或 URI, placeholder: "/cn/law/2020/civil-code#p3/c8/a577" }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: 错误类型
      options: [原文与官方不一致, 生效/失效日期错误, 已被修订未更新, 译文错误, 术语译法不统一, 案例关联错误, 其他]
    validations: { required: true }
  - type: textarea
    id: detail
    attributes: { label: 说明与正确内容 }
    validations: { required: true }
  - type: input
    id: evidence
    attributes: { label: 官方依据链接 }
    validations: { required: true }
