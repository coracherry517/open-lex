name: ✨ 功能建议
description: 提出新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: 要解决的问题, description: 用户在什么场景下遇到了什么困难？ }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: 建议方案 }
  - type: checkboxes
    id: principle
    attributes:
      label: 设计原则确认
      options:
        - label: 该功能不引入好友、关注或私信等私人社交关系
          required: true
