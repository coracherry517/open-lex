services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openlex
      POSTGRES_PASSWORD: openlex
      POSTGRES_DB: openlex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  search:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me}
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]

volumes:
  pgdata:
  meili:
